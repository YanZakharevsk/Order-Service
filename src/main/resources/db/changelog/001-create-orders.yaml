databaseChangeLog:
  - changeSet:
      id: 1
      author: hoksik

      changes:
        - createTable:
            tableName: orders


            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: total_price
                  type: decimal(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: timestamp

              - column:
                  name: updated_at
                  type: timestamp

        - createIndex:
            indexName: "idx_orders_user_id"
            tableName: orders
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: "idx_orders_status"
            tableName: orders
            columns:
              - column:
                  name: status

