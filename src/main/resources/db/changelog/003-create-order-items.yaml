databaseChangeLog:
  - changeSet:
      id: 2
      author: hoksik

      changes:
        - createTable:
            tableName: order_items

            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: order_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_order_id
                    referencedTableName: orders
                    referencedColumnNames: id
                    nullable: false

              - column:
                  name: item_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_item_id
                    referencedTableName: items
                    referencedColumnNames: id
                    nullable: false

              - column:
                  name: quantity
                  type: int
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP

              - column:
                  name: updated_at
                  type: TIMESTAMP

        - createIndex:
            indexName: "idx_order_items_order_id"
            tableName: order_items
            columns:
              - column:
                  name: order_id

        - createIndex:
            indexName: "idx_order_items_item_id"
            tableName: order_items
            columns:
              - column:
                  name: item_id